<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Underlay</title>

  <!-- A-Frame draws 3D things using HTML tags like <a-box> -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js adds marker tracking on top of A-Frame.
       Pinned to version 3.4.8 so an update can't break us mid-hackathon. -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    /* Look: a resident's maintenance terminal. Warm near-black, amber = power,
       rust/coral = danger, teal = water, dim off-white = hidden space, monospace so it reads like equipment.
       ui-monospace is SF Mono on iPhone; the rest are fallbacks. */
    :root {
      --black: #0c0c0a; --amber: #f2b33d; --text: #e8e2d4; --dim: #9a9282;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #header, #controls {
      position: fixed; left: 0; right: 0; z-index: 10;
      background: rgba(12, 12, 10, 0.85); color: var(--text);
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em;
    }
    #header { top: 0; padding: 10px 16px; font-size: 12px; color: var(--dim); }
    #header b { color: var(--amber); font-weight: 600; }
    #controls {
      bottom: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 30px; font-size: 14px;
    }
    /* Hazard stripe along the top edge of the control bar. */
    #controls::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
      background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--black) 10px 20px);
    }
    #mode-label { display: block; font-size: 11px; color: var(--dim); }
    #mode-button {
      font: inherit; text-transform: inherit; letter-spacing: inherit;
      padding: 10px 14px; border: 1px solid var(--amber); border-radius: 2px;
      background: transparent; color: var(--amber);
    }
    #mode-button:active { background: var(--amber); color: var(--black); }
    /* Resident notice: only shown in Fair share mode, sits just above the control bar. */
    #notice {
      display: none; position: fixed; left: 12px; right: 12px; bottom: 104px; z-index: 10;
      padding: 10px 12px; background: rgba(12, 12, 10, 0.9); border-left: 3px solid var(--amber);
      color: var(--text); font-family: var(--mono); font-size: 12px; line-height: 1.45;
    }
    #notice-text { margin: 0 0 8px; }
    #speak-button {
      font: inherit; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
      padding: 6px 10px; border: 1px solid var(--amber); border-radius: 2px;
      background: transparent; color: var(--amber);
    }
  </style>
</head>

<!-- Black page background: any space around the camera feed blends into the header and bar. -->
<body style="margin: 0; overflow: hidden; background: #0c0c0a;">
  <!--
    v0.2: cable sizes, flow speeds and labels now come from status.json
    (written by engine/grid_engine.py). app.js does the reading.

    Marker coordinates:
    - x = left/right, z = up/down (NEGATIVE z = toward the TOP of the marker),
      y = out of the wall toward the phone.
    Depth layers (y). The thickest cable reaches about y = 0.20 (radius ~0.15),
    so everything in front of it starts past that. Overlapping surfaces at
    almost the same depth cause speckled flicker ("z-fighting").
      0.05  cables, and the flow dots (centered ON the cable, slightly fatter)
      0.35  water pipe (prototype)
      0.50  labels (with a dark backing so they read at any angle)
    flat shader = no lighting math, so colors stay even and don't speckle.
    Starting sizes below are placeholders; app.js replaces them.
  -->
  <!-- logarithmicDepthBuffer: spreads depth precision evenly, so surfaces close together
       don't speckle into each other at AR camera distances (the remaining speckle cause). -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true">

    <!-- Our own Level 40 maintenance plate (l40.patt, made from l40_inner.png with the AR.js marker generator).
         To go back to the test marker, swap this line for:  <a-marker preset="hiro"> -->
    <a-marker type="pattern" url="l40.patt">

      <!-- ===== POWER: three cables, sized by app.js ===== -->
      <a-cylinder id="cable-up"     position="-0.50 0.05 -0.5" rotation="90 0 0" radius="0.05" height="3"   color="#7a5a1f" material="shader: flat"></a-cylinder>
      <a-cylinder id="cable-middle" position="-0.15 0.05 0.1"  rotation="90 0 0" radius="0.03" height="1.8" color="#7a5a1f" material="shader: flat"></a-cylinder>
      <a-cylinder id="cable-here"   position="0.85 0.05 0.5"   rotation="90 0 0" radius="0.01" height="1"   color="#7a5a1f" material="shader: flat"></a-cylinder>

      <a-sphere id="dot-up"     radius="0.06" color="#f2b33d" material="shader: flat" position="-0.50 0.05 1"></a-sphere>
      <a-sphere id="dot-middle" radius="0.05" color="#f2b33d" material="shader: flat" position="-0.15 0.05 1"></a-sphere>
      <a-sphere id="dot-here"   radius="0.03" color="#f2b33d" material="shader: flat" position="0.85 0.05 1"></a-sphere>

      <!-- ===== WATER: Recycler 12, prediction from engine/water.py =====
           The blue pipe is two pieces with a gap where the red section sits,
           so the red never has blue hiding inside it (that caused speckles).
           app.js shows the red section and sets the label from status.json. -->
      <a-cylinder position="-0.375 0.35 0.25" rotation="0 0 90" radius="0.05" height="1.25" color="#3f7f8c" material="shader: flat"></a-cylinder>
      <a-cylinder position="0.775 0.35 0.25"  rotation="0 0 90" radius="0.05" height="0.45" color="#3f7f8c" material="shader: flat"></a-cylinder>
      <!-- Middle section: red + pulsing when failing, plain teal when OK. Pulse only gets fatter, not longer. -->
      <a-cylinder id="water-fault" position="0.4 0.35 0.25" rotation="0 0 90" radius="0.07" height="0.3" color="#b0412e" material="shader: flat"
        animation="property: scale; from: 1 1 1; to: 1.4 1 1.4; dir: alternate; dur: 600; loop: true"></a-cylinder>
      <!-- Label sits past the pipe's right end (pipe ends at x=1.0), so its backing covers no cables. -->
      <a-text id="label-water" value=" " position="2.08 0.50 0.25" rotation="-90 0 0" width="2.1" wrap-count="31" z-offset="0.03" font="sourcecodepro"
        color="#e07a5f" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>

      <!-- ===== SPACE: sealed rooms behind this wall (from engine/space.py) =====
           Three slots; app.js sizes, places and labels them, and hides unused ones.
           Dim off-white = hidden space. They sit just behind the wall (y = -0.02). -->
      <a-plane id="room-0" visible="false" rotation="-90 0 0" color="#e8e2d4"
        material="shader: flat; transparent: true; opacity: 0.18; side: double"></a-plane>
      <a-text id="room-label-0" visible="false" value=" " rotation="-90 0 0" width="1.1" wrap-count="20" z-offset="0.03" font="sourcecodepro"
        color="#e8e2d4" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-plane id="room-1" visible="false" rotation="-90 0 0" color="#e8e2d4"
        material="shader: flat; transparent: true; opacity: 0.18; side: double"></a-plane>
      <a-text id="room-label-1" visible="false" value=" " rotation="-90 0 0" width="1.1" wrap-count="20" z-offset="0.03" font="sourcecodepro"
        color="#e8e2d4" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-plane id="room-2" visible="false" rotation="-90 0 0" color="#e8e2d4"
        material="shader: flat; transparent: true; opacity: 0.18; side: double"></a-plane>
      <a-text id="room-label-2" visible="false" value=" " rotation="-90 0 0" width="1.1" wrap-count="20" z-offset="0.03" font="sourcecodepro"
        color="#e8e2d4" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-text id="label-space" value=" " position="-2.6 0.50 1.85" rotation="-90 0 0" width="2.4" wrap-count="37" z-offset="0.03" font="sourcecodepro"
        color="#e8e2d4" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>

      <!-- ===== LABELS (text filled in by app.js) =====
           geometry width/height "auto" sizes a dark plate behind the text.
           wrap-count sets letter size: width / wrap-count = one letter's width.
           z-offset lifts the letters off their plate so they don't speckle into it. -->
      <a-text id="label-up"     value=" " position="1.05 0.50 -1.9" rotation="-90 0 0" width="2.1" wrap-count="31" z-offset="0.03" font="sourcecodepro"
        color="#f2b33d" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-text id="label-middle" value=" " position="1.05 0.50 -0.7" rotation="-90 0 0" width="2.1" wrap-count="31" z-offset="0.03" font="sourcecodepro"
        color="#f2b33d" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-text id="label-here"   value=" " position="0.85 0.50 1.35" rotation="-90 0 0" width="2.1" wrap-count="31" z-offset="0.03" font="sourcecodepro"
        color="#f2b33d" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>
      <a-text id="label-risk"   value=" " position="0.40 0.50 1.85" rotation="-90 0 0" width="2.1" wrap-count="23" z-offset="0.03" font="sourcecodepro"
        color="#e07a5f" align="center" geometry="primitive: plane; width: auto; height: auto" material="color: #0c0c0a; opacity: 0.8; shader: flat"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Header: where you are (static text) -->
  <div id="header"><b>Underlay</b> // Plate L40-C // Level 40</div>

  <!-- Resident notice (text written by engine/write_notice.py, filled in by app.js) -->
  <div id="notice">
    <p id="notice-text"></p>
    <button id="speak-button">Read aloud</button>
  </div>

  <!-- Control bar: which split is showing, and the button to switch -->
  <div id="controls">
    <span><span id="mode-label">Viewing</span><span id="mode-name">Loading grid data...</span></span>
    <button id="mode-button">Show fair share</button>
  </div>

  <!-- ?v= forces Safari to fetch the newest app.js instead of an old saved copy.
       Bump the number every time app.js changes. -->
  <script src="app.js?v=12"></script>
</body>
</html>
