<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Underlay</title>

  <!-- A-Frame draws 3D things using HTML tags like <a-box> -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js adds marker tracking on top of A-Frame.
       Pinned to version 3.4.8 so an update can't break us mid-hackathon. -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    /* The control bar sits on top of the camera view at the bottom of the screen. */
    #controls {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 28px; background: rgba(12, 12, 10, 0.82);
      color: #e8e2d4; font-family: monospace; font-size: 15px;
    }
    #mode-button {
      font: inherit; padding: 10px 14px; border: 1px solid #f2b33d;
      background: transparent; color: #f2b33d; border-radius: 4px;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">
  <!--
    v0.2: cable sizes, flow speeds and labels now come from status.json
    (written by engine/grid_engine.py). app.js does the reading.

    Marker coordinates:
    - x = left/right, z = up/down (NEGATIVE z = toward the TOP of the marker),
      y = out of the wall toward the phone.
    Depth layers (y), so nothing flickers ("z-fighting"):
      0.05 cables, 0.12 flow dots, 0.20 water pipe, 0.30 labels.
    Starting sizes below are placeholders; app.js replaces them.
  -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <!-- Our own Level 40 maintenance plate (markers/l40.patt, made from markers/l40_inner.png).
         To go back to the test marker, swap this line for:  <a-marker preset="hiro"> -->
    <a-marker type="pattern" url="markers/l40.patt">

      <!-- ===== POWER: three cables, sized by app.js ===== -->
      <a-cylinder id="cable-up"     position="-0.50 0.05 -0.5" rotation="90 0 0" radius="0.05" height="3"   color="#7a5a1f"></a-cylinder>
      <a-cylinder id="cable-middle" position="-0.15 0.05 0.1"  rotation="90 0 0" radius="0.03" height="1.8" color="#7a5a1f"></a-cylinder>
      <a-cylinder id="cable-here"   position="0.85 0.05 0.5"   rotation="90 0 0" radius="0.01" height="1"   color="#7a5a1f"></a-cylinder>

      <a-sphere id="dot-up"     radius="0.06" color="#f2b33d" position="-0.50 0.12 1"></a-sphere>
      <a-sphere id="dot-middle" radius="0.05" color="#f2b33d" position="-0.15 0.12 1"></a-sphere>
      <a-sphere id="dot-here"   radius="0.03" color="#f2b33d" position="0.85 0.12 1"></a-sphere>

      <!-- ===== WATER: still a placeholder (water layer is a Nov 17 booster) ===== -->
      <a-cylinder position="0 0.20 0.25" rotation="0 0 90" radius="0.05" height="2" color="#3f7f8c"></a-cylinder>
      <a-cylinder position="0.4 0.20 0.25" rotation="0 0 90" radius="0.07" height="0.3" color="#b0412e"
        animation="property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dir: alternate; dur: 600; loop: true"></a-cylinder>

      <!-- ===== LABELS (text filled in by app.js) ===== -->
      <a-text id="label-up"     value="" position="0.55 0.30 -1.9" rotation="-90 0 0" width="2.4" color="#f2b33d"></a-text>
      <a-text id="label-middle" value="" position="0.55 0.30 -0.7" rotation="-90 0 0" width="2.4" color="#f2b33d"></a-text>
      <a-text id="label-here"   value="" position="0.75 0.30 1.25" rotation="-90 0 0" width="2.4" color="#f2b33d"></a-text>
      <a-text id="label-risk"   value="" position="-0.2 0.30 1.6" rotation="-90 0 0" width="3"   color="#e07a5f"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Control bar: which split is showing, and the button to switch -->
  <div id="controls">
    <span id="mode-name">Loading grid data...</span>
    <button id="mode-button">Show fair share</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
