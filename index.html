<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Underlay</title>

  <!-- A-Frame draws 3D things using HTML tags like <a-box> -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js adds marker tracking on top of A-Frame.
       Pinned to version 3.4.8 so an update can't break us mid-hackathon. -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <!--
    v0 goal: prove we can put a "power cable" and a "water pipe" on a wall marker.
    No real data yet. The numbers in the labels are placeholders.

    How marker coordinates work (important for everything we draw):
    - The marker is a flat square. Its center is (0, 0, 0).
    - x = left/right along the marker
    - z = up/down along the marker (NEGATIVE z = toward the TOP edge of the marker)
    - y = straight out of the marker toward your phone
    So if the marker is taped on a wall, "up the wall" means negative z,
    and we keep things at a small y so they sit just in front of the wall.
  -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <a-marker preset="hiro">

      <!-- ===== POWER: two thick cables carrying power UP to the upper levels ===== -->
      <!-- Cylinders stand upright by default, so rotate 90 degrees on x to lay them flat along z -->
      <a-cylinder position="-0.45 0.05 -0.5" rotation="90 0 0" radius="0.06" height="3" color="#7a5a1f"></a-cylinder>
      <a-cylinder position="-0.20 0.05 -0.5" rotation="90 0 0" radius="0.06" height="3" color="#7a5a1f"></a-cylinder>

      <!-- "Flow" dots sliding up each cable. Each one loops from the bottom (z=1) to the top (z=-2).
           Different delays spread them out so it looks like a stream, not one blob. -->
      <a-sphere radius="0.07" color="#f2b33d" position="-0.45 0.05 1"
        animation="property: position; from: -0.45 0.05 1; to: -0.45 0.05 -2; dur: 1500; loop: true; easing: linear"></a-sphere>
      <a-sphere radius="0.07" color="#f2b33d" position="-0.45 0.05 1"
        animation="property: position; from: -0.45 0.05 1; to: -0.45 0.05 -2; dur: 1500; delay: 750; loop: true; easing: linear"></a-sphere>
      <a-sphere radius="0.07" color="#f2b33d" position="-0.20 0.05 1"
        animation="property: position; from: -0.20 0.05 1; to: -0.20 0.05 -2; dur: 1500; delay: 375; loop: true; easing: linear"></a-sphere>
      <a-sphere radius="0.07" color="#f2b33d" position="-0.20 0.05 1"
        animation="property: position; from: -0.20 0.05 1; to: -0.20 0.05 -2; dur: 1500; delay: 1125; loop: true; easing: linear"></a-sphere>

      <!-- One thin cable for OUR level: slower flow, smaller dot = less power -->
      <a-cylinder position="0.55 0.05 0.5" rotation="90 0 0" radius="0.015" height="1" color="#7a5a1f"></a-cylinder>
      <a-sphere radius="0.03" color="#f2b33d" position="0.55 0.05 1"
        animation="property: position; from: 0.55 0.05 1; to: 0.55 0.05 0; dur: 3000; loop: true; easing: linear"></a-sphere>

      <!-- Labels. a-text faces +z by default, so rotate -90 on x to lay it flat facing the phone -->
      <a-text value="71% goes up" position="-0.9 0.1 -1.6" rotation="-90 0 0" width="3" color="#f2b33d"></a-text>
      <a-text value="9% stays on level 40" position="0.3 0.1 1.2" rotation="-90 0 0" width="2.5" color="#f2b33d"></a-text>

      <!-- ===== WATER: one pipe running sideways, with a failing section ===== -->
      <a-cylinder position="0 0.05 0.25" rotation="0 0 90" radius="0.05" height="2" color="#3f7f8c"></a-cylinder>
      <!-- The failing section: slightly thicker, rust red, and it pulses bigger and smaller -->
      <a-cylinder position="0.4 0.05 0.25" rotation="0 0 90" radius="0.07" height="0.3" color="#b0412e"
        animation="property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dir: alternate; dur: 600; loop: true"></a-cylinder>
      <a-text value="Recycler 12: fails in ~3 days" position="0.05 0.1 0.55" rotation="-90 0 0" width="2.2" color="#e07a5f"></a-text>

    </a-marker>

    <!-- The camera. AR.js moves the marker content around this camera as you move the phone. -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
